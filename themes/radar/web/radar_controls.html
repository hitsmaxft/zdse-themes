<fieldset id="radar-controls">
  <legend data-i18n="radar_controls"></legend>
  <label for="radar-speed" data-i18n="radar_speed"></label>
  <select id="radar-speed"><option value="0" data-i18n="radar_active"></option><option value="1" data-i18n="radar_quiet"></option></select>
  <label for="radar-start" data-i18n="radar_start"></label>
  <select id="radar-start"><option value="0" data-i18n="radar_warmed"></option><option value="1" data-i18n="radar_cold"></option></select>
  <div class="controls"><button id="radar-aurora" data-i18n="radar_aurora"></button><button id="radar-targets" class="active" data-i18n="radar_targets"></button><button id="radar-damage" data-i18n="radar_damage"></button></div>
</fieldset>
